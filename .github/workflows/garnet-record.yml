# Records the dependency install under the Garnet sensor on every pull request,
# Dependabot's included, and on every push to the default branch. Pull request
# runs get one Runtime Review comment per head commit. Default-branch pushes
# post no comment; they leave the base record a pull request's first recorded
# commit is compared with. Later commits compare with the previous recorded
# commit on the pull request.
name: Garnet Runtime Visibility

on:
  push:
    branches: ['main']
  pull_request:

permissions: {}

concurrency:
  group: garnet-record-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dep-install:
    name: Dependency install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Report Node and npm versions
        run: node --version && npm --version

      # OIDC exchange; pull requests from other repositories receive no token
      # and the action falls back to a local, best-effort record.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      # CI may reach only package registries. Lifecycle scripts run for every
      # package except those in SKIP_INSTALL_SCRIPTS: snyk's postinstall
      # downloads its CLI binary from downloads.snyk.io and reports download
      # errors to Sentry. node-gyp builds against the local Node headers
      # instead of fetching them from nodejs.org.
      - name: Install dependencies (lifecycle scripts execute here)
        env:
          SKIP_INSTALL_SCRIPTS: snyk
          SNYK_DISABLE_ANALYTICS: "1"
        run: |
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          npm ci --ignore-scripts
          pkgs=$(node -e '
            const fs = require("fs");
            const skip = process.env.SKIP_INSTALL_SCRIPTS.split(/\s+/);
            const { packages } = require("./package-lock.json");
            console.log(Object.entries(packages)
              .filter(([p, v]) => p && v.hasInstallScript && fs.existsSync(p))
              .map(([p]) => p.split("node_modules/").pop())
              .filter((name) => !skip.includes(name))
              .join(" "));
          ')
          if [ -n "$pkgs" ]; then npm rebuild --foreground-scripts $pkgs; fi

      - name: Let sensor settle
        if: always()
        run: sleep 30
